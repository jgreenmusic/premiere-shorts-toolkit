<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Toolkit</title>
<style>
:root {
  --bg: #0e1014; --surface: #161a20; --surface-2: #1c2129; --border: #262c36;
  --text: #e8eaed; --muted: #98a2ae; --faint: #6b7480;
  --accent: #f5c542; --accent-ink: #1a1400; --accent-soft: rgba(245,197,66,.12);
  --ok: #3fb950; --warn: #e3a02b; --bad: #f85149; --info: #58a6ff;
  --radius: 14px; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e1e5ea;
  --text: #15181d; --muted: #5b6470; --faint: #8a93a0;
  --accent: #c9960e; --accent-ink: #ffffff; --accent-soft: rgba(201,150,14,.12);
  --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --info: #0969da;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }

/* top bar */
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo span { display: block; width: 14px; height: 3px; border-radius: 2px; background: var(--accent-ink); box-shadow: 0 -5px 0 var(--accent-ink), 0 5px 0 var(--accent-ink); }
header h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
header .ver { color: var(--faint); font-size: 12px; margin-left: -4px; }
header .spacer { flex: 1; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 9px; height: 32px; padding: 0 10px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--text); background: var(--surface-2); }

/* sidebar */
aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 12px 90px; background: var(--surface); }
.side-title { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 10px; }
.side-title h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 600; }
.search { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); margin-bottom: 12px; outline: none; }
.search:focus { border-color: var(--accent); }
.group { margin-bottom: 10px; }
.group-name { font-size: 13px; color: var(--muted); padding: 6px 8px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 7px 10px; cursor: pointer; }
.proj:hover { background: var(--surface-2); }
.proj.active { background: var(--accent-soft); }
.proj .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.proj.active .tag { border-color: var(--accent); color: var(--text); }
.proj .when { margin-left: auto; font-size: 12px; color: var(--faint); }
.side-actions { display: flex; gap: 8px; padding: 6px 8px 14px; }

/* main */
main { overflow-y: auto; padding: 28px 36px 120px; }
.wrap { max-width: 920px; margin: 0 auto; }
.hero { margin-bottom: 26px; }
.hero h2 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.02em; font-weight: 650; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.pill b { color: var(--text); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 120px 20px; }
.empty h2 { color: var(--text); font-size: 22px; margin-bottom: 6px; }

.step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.step-head { display: flex; gap: 14px; padding: 18px 20px; align-items: flex-start; }
.num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.step.done .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step-title { flex: 1; min-width: 0; }
.step-title h3 { margin: 2px 0 2px; font-size: 16px; font-weight: 650; }
.step-title p { margin: 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
.step-body { padding: 0 20px 20px 64px; }
.optional { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-left: 6px; font-weight: 600; }

.btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.link { background: none; border: 0; padding: 4px 6px; color: var(--muted); font-weight: 500; }
.btn.link:hover { color: var(--text); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row + .row, .row + .result, .result + .row { margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input[type=text] { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; width: 120px; outline: none; }
.field input[type=text]:focus { border-color: var(--accent); }
.field input.wide { width: 360px; max-width: 100%; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
input[type=range] { accent-color: var(--accent); width: 180px; }
.hint { font-size: 13px; color: var(--faint); }

.result { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.result h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.bars { display: grid; grid-template-columns: 190px 1fr 64px; gap: 7px 12px; align-items: center; font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bars .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.drift { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-top: 6px; }
.drift div { flex: 1; background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.drift-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.spell { font-weight: 800; letter-spacing: .02em; font-family: "Segoe UI Black", "Segoe UI", sans-serif; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(227,160,43,.15); color: var(--warn); }
.scroll { max-height: 300px; overflow-y: auto; }
video { width: 100%; max-width: 300px; border-radius: 12px; background: #000; display: block; aspect-ratio: 9/16; }
.preview-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
ol.howto { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
ol.howto li { margin: 3px 0; }
ol.howto b { color: var(--text); font-weight: 600; }
.scripts { display: grid; gap: 8px; }
.script { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.script code { font: 13px/1.3 "Cascadia Code", Consolas, monospace; }
.script span { color: var(--faint); font-size: 13px; flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* log drawer */
.log { position: fixed; left: 300px; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,.2); }
.log-head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; user-select: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.run { background: var(--info); animation: pulse 1.2s infinite; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.log-head .status { font-weight: 600; font-size: 14px; }
.log-head .last { color: var(--muted); font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: "Cascadia Code", Consolas, monospace; }
.log pre { margin: 0; max-height: 34vh; overflow: auto; padding: 0 20px 16px; font: 12.5px/1.55 "Cascadia Code", Consolas, monospace; color: var(--muted); white-space: pre-wrap; }
.log.closed pre { display: none; }
.toast { position: fixed; top: 70px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--bad); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 360px; font-size: 14px; display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; }
  aside { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .log { left: 0; }
  main { padding: 20px 16px 120px; }
  .step-body { padding-left: 20px; }
  .preview-grid, .two { grid-template-columns: 1fr; }
  .bars { grid-template-columns: 130px 1fr 48px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"><span></span></div>
    <h1>Shorts Toolkit</h1><span class="ver" id="ver"></span>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" title="Switch light / dark">◐ Theme</button>
  </header>

  <aside>
    <div class="side-title"><h2>Projects</h2></div>
    <input class="search" id="search" placeholder="Filter projects…" aria-label="Filter projects">
    <div class="side-actions">
      <button class="btn" id="browseProject">Open project…</button>
      <button class="btn link" id="addFolder" title="Add a folder to scan for projects">+ Folder</button>
    </div>
    <div id="projects"></div>
  </aside>

  <main><div class="wrap" id="main">
    <div class="empty"><h2>Pick a project</h2><p>Choose a Premiere project on the left.<br>Save it in Premiere first (Ctrl+S) — the toolkit reads the saved file.</p></div>
  </div></main>
</div>

<div class="log closed" id="log">
  <div class="log-head" id="logHead">
    <span class="dot" id="dot"></span><span class="status" id="status">Ready</span>
    <span class="last" id="last"></span><span class="hint" id="toggleHint">Show log ▴</span>
  </div>
  <pre id="logText"></pre>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = async (url, body) => {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const hms = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
// long project names share a prefix: keep the start AND the end ("…TogetherV0.4")
const short = (s, n = 34) => s.length <= n ? s : s.slice(0, 14) + "…" + s.slice(-(n - 15));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000); }

// ---- theme --------------------------------------------------------------
const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {} };
try { setTheme(localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")); } catch (e) { setTheme("dark"); }
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

// ---- state --------------------------------------------------------------
let S = { projects: [], current: null, info: null, busy: false, scripts: [] };
const opts = { loud: 1.6, at: "", seconds: 12, noHighlight: false, video: "", start: "0" };

async function loadState() {
  const st = await api("/api/state");
  S.projects = st.projects; S.scripts = st.scripts;
  $("#ver").textContent = "v" + st.version;
  renderProjects();
}

function renderProjects() {
  const q = $("#search").value.toLowerCase();
  const groups = {};
  for (const p of S.projects) if (!q || p.name.toLowerCase().includes(q)) (groups[p.base] ||= []).push(p);
  const html = Object.entries(groups).map(([base, list]) => `
    <div class="group"><div class="group-name" title="${esc(base)}">${esc(short(base))}</div>
    ${list.sort((a, b) => a.version === "original" ? -1 : b.version === "original" ? 1 : a.version.localeCompare(b.version, undefined, { numeric: true }))
      .map(p => `<button class="proj ${p.path === S.current ? "active" : ""}" data-path="${esc(p.path)}">
        <span class="tag">${esc(p.version)}</span><span class="when">${ago(p.modified)}</span></button>`).join("")}
    </div>`).join("");
  $("#projects").innerHTML = html || `<p class="hint" style="padding:0 8px">No projects found. Use “Open project…”.</p>`;
  document.querySelectorAll(".proj").forEach(b => b.onclick = () => select(b.dataset.path));
}
$("#search").oninput = renderProjects;
$("#browseProject").onclick = async () => { const r = await api("/api/browse", { kind: "project" }); if (r.path) select(r.path); };
$("#addFolder").onclick = async () => { const r = await api("/api/browse", { kind: "folder" }); if (r.path) loadState(); };

async function select(path) {
  S.current = path; renderProjects();
  $("#main").innerHTML = `<div class="empty"><p>Reading project…</p></div>`;
  try { S.info = await api("/api/info?path=" + encodeURIComponent(path)); renderMain(); }
  catch (e) { $("#main").innerHTML = `<div class="empty"><h2>Couldn't read that project</h2><p>${esc(e.message)}</p></div>`; }
}

// ---- main view ------------------------------------------------------------
const STATUS = [
  ["ok", "In sync", "var(--ok)"], ["early", "Appear too early", "var(--warn)"], ["late", "Appear too late", "var(--warn)"],
  ["cut-off", "Disappear too soon", "var(--bad)"], ["lingers", "Stay up too long", "var(--warn)"],
  ["no-match", "Couldn't hear the words", "var(--faint)"], ["empty", "Empty captions", "var(--bad)"],
];

function renderMain() {
  const I = S.info, R = I.results, seq = I.sequences.find(s => s.captions) || I.sequences[0] || {};
  const name = I.path.split(/[\\/]/).pop().replace(/\.prproj$/i, "");
  const synced = S.projects.filter(p => p.base === name.replace(/_captions-synced(-v\d+)?$/, "") && p.version !== "original");
  const isSynced = /_captions-synced/.test(name);
  const d = (flag) => flag ? "done" : "";
  const dis = S.busy ? "disabled" : "";

  $("#main").innerHTML = `
  <div class="hero">
    <h2>${esc(name)}</h2>
    <div class="meta">
      <span class="pill">Sequence <b>${esc(seq.name || "—")}</b></span>
      <span class="pill"><b>${(seq.captions || 0).toLocaleString()}</b> captions</span>
      <span class="pill"><b>${seq.seconds ? hms(seq.seconds) : "—"}</b> long</span>
      <span class="pill">${isSynced ? "Synced copy" : "Original"}</span>
      ${I.sequences.filter(s => s.captions).length > 1 ? `<span class="pill" style="color:var(--warn)">Several sequences have captions — tools use the first</span>` : ""}
    </div>
  </div>

  <section class="step ${d(R.check)}">
    <div class="step-head"><div class="num">1</div><div class="step-title">
      <h3>Check caption timing</h3>
      <p>Listens to the audio and compares every caption with when the words are actually spoken. Changes nothing.</p></div>
      <button class="btn ${R.check ? "" : "primary"}" data-run="check" ${dis}>${R.check ? "Check again" : "Run check"}</button></div>
    ${R.check ? `<div class="step-body"><div class="result">
      <h4><span>${R.check.total.toLocaleString()} captions checked${R.check.of ? ` · on the <b style="color:var(--text)">${esc(R.check.of)}</b> version` : ""}</span><span>${ago(R.check.when)}</span></h4>
      <div class="bars">${STATUS.map(([k, label, col]) => {
        const n = R.check.counts[k] || 0; if (!n && k !== "ok") return "";
        return `<span>${label}</span><div class="bar"><i style="width:${Math.max(1, 100 * n / R.check.total)}%;background:${col}"></i></div><span class="n">${n.toLocaleString()}</span>`;
      }).join("")}</div>
      ${R.check.drift.length ? `<h4 style="margin-top:16px"><span>Caption delay across the video (a rising line means drift)</span></h4>
        <div class="drift">${R.check.drift.map(([t, v]) => `<div title="${t}: ${v > 0 ? "+" : ""}${v.toFixed(2)}s" style="height:${Math.min(100, 4 + Math.abs(v) * 192)}%"></div>`).join("")}</div>
        <div class="drift-labels"><span>${R.check.drift[0][0]}</span>
          <span>captions show up ${(() => { const v = R.check.drift.map(x => x[1]); const lo = Math.min(...v), hi = Math.max(...v);
            const f = x => (x >= 0 ? "+" : "") + x.toFixed(2) + "s"; return lo === hi ? f(lo) : f(lo) + " to " + f(hi); })()} after the words · bar height 0.5s = full</span>
          <span>${R.check.drift.at(-1)[0]}</span></div>` : ""}
      <div class="row"><button class="btn link" data-open="${esc(I.outdir)}\\caption-report.csv">Open full table</button>
        <button class="btn link" data-folder="${esc(I.outdir)}">Open report folder</button></div>
    </div></div>` : ""}
  </section>

  <section class="step ${d(synced.length)}">
    <div class="step-head"><div class="num">2</div><div class="step-title">
      <h3>Fix timing &amp; fit lengths</h3>
      <p>Moves captions that are off, and makes each one stay up exactly as long as its words are voiced. Writes a <b>new copy</b> of the project — your original is never changed.</p></div>
      <button class="btn ${synced.length ? "" : "primary"}" data-run="fix" ${dis}>Create synced copy</button></div>
    ${synced.length || R.too_short ? `<div class="step-body"><div class="result">
      ${synced.length ? `<h4><span>Synced copies</span></h4><div class="row">${synced.map(p => `<button class="btn" data-select="${esc(p.path)}">${esc(p.version)} · ${ago(p.modified)}</button>`).join("")}</div>` : ""}
      ${R.too_short ? `<p class="hint" style="margin:12px 0 0">${R.too_short} captions are too short to read and have no room to grow — merge them by hand.
        <button class="btn link" data-open="${esc(I.outdir)}\\too-short-captions.txt">See list</button></p>` : ""}
    </div></div>` : ""}
  </section>

  <section class="step ${d(R.screams)}">
    <div class="step-head"><div class="num">3</div><div class="step-title">
      <h3>Animated screams</h3>
      <p>Finds long, loud “AAAH / OHHH / NOOO” moments and spells them out letter by letter as the voice goes on.</p></div>
      <button class="btn ${R.screams ? "" : "primary"}" data-run="screams" ${dis}>Find screams</button></div>
    <div class="step-body">
      <div class="row"><label class="field">How loud counts as a scream
        <span class="row" style="gap:10px"><span class="hint">more</span><input type="range" id="loud" min="1.2" max="2.4" step="0.1" value="${opts.loud}"><span class="hint">fewer</span><b id="loudVal">${opts.loud.toFixed(1)}×</b></span></label></div>
      ${R.screams ? `<div class="result">
        <h4><span>${R.screams.items.length} screams</span><span>${ago(R.screams.when)}</span></h4>
        <div class="scroll"><table><thead><tr><th>At</th><th>Length</th><th>Loudness</th><th>Becomes</th><th></th></tr></thead><tbody>
        ${R.screams.items.map(s => `<tr><td>${s.at.replace(/\.\d+$/, "")}</td><td>${s.seconds.toFixed(1)}s</td><td>${s.loud.toFixed(1)}×</td>
          <td class="spell">${esc(s.spelled)}</td><td>${s.check ? `<span class="badge" title="Long - may be laughing or game audio">CHECK</span>` : ""}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="row"><button class="btn link" data-folder="${esc(R.screams.srt)}">Show caption file (.srt)</button></div>
      </div>` : ""}
    </div>
  </section>

  <section class="step ${d(R.prepare)}">
    <div class="step-head"><div class="num">4</div><div class="step-title">
      <h3>Animate in Premiere</h3>
      <p>Every caption gets its own entrance: a full pop after a pause, a tiny one in fast talk, a bigger one for loud lines, and a wobble for screams.</p></div>
      <button class="btn ${R.prepare ? "" : "primary"}" data-run="prepare" ${dis}>Prepare for Premiere</button></div>
    <div class="step-body">
      ${R.prepare ? `<div class="result" style="margin-bottom:14px"><h4><span>Marked <b style="color:var(--text)">${R.prepare.loud}</b> loud lines and <b style="color:var(--text)">${R.prepare.scream}</b> screams for Premiere</span><span>${ago(R.prepare.when)}</span></h4></div>` : ""}
      <div class="two">
        <div><h4 style="margin:0 0 8px;font-size:14px">In Premiere</h4>
          <ol class="howto">
            <li>Open this project and <b>save</b>.</li>
            <li>Select the captions → <b>Graphics and Titles → Upgrade Caption to Graphic</b>.</li>
            <li>Mark the Short with <b>I</b> and <b>O</b> (or select clips).</li>
            <li>Run <b>animate-captions.jsx</b> ↓ (VS Code → Ctrl+Shift+P → <i>Evaluate Script in Attached Host</i>).</li>
          </ol></div>
        <div><h4 style="margin:0 0 8px;font-size:14px">Render</h4>
          <ol class="howto">
            <li><b>Ctrl+M</b> → H.264, <b>Match Source – High Bitrate</b>.</li>
            <li>Captions: <b>None</b> (they're graphics now).</li>
            <li><b>Send to Media Encoder</b> → <b>Start Queue ▶</b>.</li>
          </ol></div>
      </div>
      <div class="scripts" style="margin-top:16px">
        ${[["animate-captions.jsx", "Pop-in / fade for every caption (set MODE = \"remove\" to undo)"],
           ["import-captions.jsx", "Bring the scream caption file in as a new track"],
           ["cut-at-markers.jsx", "Razor every track at every marker"],
           ["match-scale-vertical.jsx", "1080×1920 + match every clip's scale"]]
          .filter(([f]) => S.scripts.includes(f))
          .map(([f, what]) => `<div class="script"><code>${f}</code><span>${what}</span><button class="btn" data-script="${f}">Open in VS Code</button></div>`).join("")}
      </div>
    </div>
  </section>

  <section class="step ${d(R.previews && R.previews.length)}">
    <div class="step-head"><div class="num">5</div><div class="step-title">
      <h3>Burned-in look <span class="optional">optional</span></h3>
      <p>The full style Premiere can't do: the spoken word highlighted as it's said. Captions are drawn into the video after you export.</p></div></div>
    <div class="step-body">
      <div class="preview-grid">
        <div>${R.previews && R.previews.length
            ? `<video id="vid" controls playsinline src="/media?path=${encodeURIComponent(I.outdir + "\\" + R.previews[0])}"></video>`
            : `<div class="result" style="aspect-ratio:9/16;max-width:300px;display:grid;place-items:center;text-align:center" ><span class="hint">Render a preview<br>to see the look here</span></div>`}</div>
        <div>
          <h4 style="margin:0 0 10px;font-size:14px">Try it on a few seconds</h4>
          <div class="row">
            <label class="field">Start at (h:mm:ss)<input type="text" id="at" value="${esc(opts.at || (R.screams && R.screams.items[0] ? R.screams.items[0].at.replace(/\.\d+$/, "") : "0:10:00"))}"></label>
            <label class="field">Seconds<input type="text" id="secs" value="${opts.seconds}" style="width:70px"></label>
          </div>
          <div class="row"><label class="check"><input type="checkbox" id="noHl" ${opts.noHighlight ? "checked" : ""}> No word highlight</label></div>
          <div class="row"><button class="btn primary" data-run="preview" ${dis}>Render preview</button>
            ${R.previews && R.previews.length > 1 ? `<select id="pv" class="btn">${R.previews.map(p => `<option>${esc(p)}</option>`).join("")}</select>` : ""}</div>
          <h4 style="margin:24px 0 10px;font-size:14px">Burn onto your export</h4>
          <p class="hint" style="margin:0 0 10px">Export from Premiere with the caption track <b>off</b>, then pick that file.</p>
          <div class="row">
            <label class="field">Exported video<input type="text" class="wide" id="video" value="${esc(opts.video)}" placeholder="C:\\…\\export.mp4"></label>
            <button class="btn" id="pickVideo" style="align-self:flex-end">Browse…</button>
          </div>
          <div class="row">
            <label class="field">Export starts at<input type="text" id="start" value="${esc(opts.start)}"></label>
            <button class="btn primary" data-run="burn" style="align-self:flex-end" ${dis}>Burn captions</button>
          </div>
          <p class="hint">Audio is copied untouched. Leave “starts at” as 0 if you exported the whole sequence.</p>
        </div>
      </div>
    </div>
  </section>`;
  wire();
}

function wire() {
  const loud = $("#loud");
  if (loud) loud.oninput = () => { opts.loud = +loud.value; $("#loudVal").textContent = opts.loud.toFixed(1) + "×"; };
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = () => run(b.dataset.run));
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => api("/api/open", { path: b.dataset.open, how: "file" }).catch(e => toast(e.message)));
  document.querySelectorAll("[data-folder]").forEach(b => b.onclick = () => api("/api/open", { path: b.dataset.folder, how: "folder" }));
  document.querySelectorAll("[data-select]").forEach(b => b.onclick = () => select(b.dataset.select));
  document.querySelectorAll("[data-script]").forEach(b => b.onclick = () => api("/api/open", { path: "", script: b.dataset.script, how: "vscode" }));
  const pv = $("#pv");
  if (pv) pv.onchange = () => $("#vid").src = "/media?path=" + encodeURIComponent(S.info.outdir + "\\" + pv.value);
  const pick = $("#pickVideo");
  if (pick) pick.onclick = async () => { const r = await api("/api/browse", { kind: "video" }); if (r.path) { opts.video = r.path; $("#video").value = r.path; } };
  for (const [id, key] of [["at", "at"], ["secs", "seconds"], ["video", "video"], ["start", "start"]]) {
    const el = $("#" + id); if (el) el.oninput = () => opts[key] = el.value;
  }
  const hl = $("#noHl"); if (hl) hl.onchange = () => opts.noHighlight = hl.checked;
}

// ---- running things --------------------------------------------------------
const TITLES = { check: "Checking caption timing", fix: "Creating synced copy", screams: "Finding screams",
  prepare: "Preparing for Premiere", preview: "Rendering preview", burn: "Burning captions onto video" };

async function run(action) {
  if (S.busy) return;
  const body = { action, title: TITLES[action], path: S.current, loud: opts.loud };
  if (action === "preview") { body.at = $("#at").value.trim(); body.seconds = +$("#secs").value || 12; body.no_highlight = opts.noHighlight; opts.at = body.at; }
  if (action === "burn") {
    body.video = $("#video").value.trim(); body.start = $("#start").value.trim() || "0"; body.no_highlight = opts.noHighlight;
    if (!body.video) return toast("Pick the video you exported from Premiere first.");
  }
  try { await api("/api/run", body); } catch (e) { return toast(e.message); }
  S.busy = true; renderMain(); openLog(true); poll(0);
}

async function poll(from) {
  let j;
  try { j = await api("/api/job?from=" + from); } catch (e) { setTimeout(() => poll(from), 1000); return; }
  const pre = $("#logText");
  if (from === 0) pre.textContent = "";
  if (j.lines.length) {
    // ffmpeg progress replaces its own line: redraw the last line when it changes
    const all = pre.textContent.split("\n");
    if (from > 0 && j.lines[0].startsWith("frame=") && (all.at(-1) || "").startsWith("frame=")) all.pop();
    pre.textContent = [...all.filter((l, i) => i || l), ...j.lines].join("\n");
    pre.scrollTop = pre.scrollHeight;
  }
  const last = (pre.textContent.trim().split("\n").at(-1) || "");
  $("#last").textContent = last;
  const secs = Math.round(Date.now() / 1000 - j.started);
  if (!j.done) {
    setStatus("run", `${j.title}… ${secs < 60 ? secs + "s" : Math.floor(secs / 60) + "m " + secs % 60 + "s"}`);
    setTimeout(() => poll(j.total - (j.lines.length && j.lines.at(-1).startsWith("frame=") ? 1 : 0)), 500);
    return;
  }
  S.busy = false;
  setStatus(j.code === 0 ? "ok" : "bad", j.code === 0 ? `${j.title} — done` : `${j.title} — failed (see log)`);
  if (j.code !== 0) openLog(true);
  await loadState();
  await select(S.current);
}

function setStatus(kind, text) { $("#dot").className = "dot " + kind; $("#status").textContent = text; }
function openLog(open) { $("#log").classList.toggle("closed", !open); $("#toggleHint").textContent = open ? "Hide log ▾" : "Show log ▴"; }
$("#logHead").onclick = () => openLog($("#log").classList.contains("closed"));

// keep the local server alive while this tab is open
setInterval(() => api("/api/ping", {}).catch(() => setStatus("bad", "Toolkit closed — start it again")), 15000);

(async () => {
  await loadState();
  const j = await api("/api/job?from=0");
  if (!j.done) { S.busy = true; openLog(true); poll(0); }
  if (S.projects[0]) select(S.projects[0].path);
})();
</script>
</body>
</html>
