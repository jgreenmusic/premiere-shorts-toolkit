<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts Toolkit</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1014">
<style>
:root {
  --bg: #0e1014; --surface: #161a20; --surface-2: #1c2129; --border: #262c36;
  --text: #e8eaed; --muted: #98a2ae; --faint: #6b7480;
  --accent: #f5c542; --accent-ink: #1a1400; --accent-soft: rgba(245,197,66,.12);
  --ok: #3fb950; --warn: #e3a02b; --bad: #f85149; --info: #58a6ff;
  --radius: 14px; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e1e5ea;
  --text: #15181d; --muted: #5b6470; --faint: #8a93a0;
  --accent: #c9960e; --accent-ink: #ffffff; --accent-soft: rgba(201,150,14,.12);
  --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --info: #0969da;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }

header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo span { display: block; width: 14px; height: 3px; border-radius: 2px; background: var(--accent-ink); box-shadow: 0 -5px 0 var(--accent-ink), 0 5px 0 var(--accent-ink); }
header h1 { font-size: 16px; font-weight: 650; margin: 0; }
header .ver { color: var(--faint); font-size: 12px; margin-left: -4px; }
header .spacer { flex: 1; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 9px; height: 32px; padding: 0 10px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--text); background: var(--surface-2); }

aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 12px 90px; background: var(--surface); }
.side-title h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 8px 10px; font-weight: 600; }
.search { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); margin-bottom: 10px; outline: none; }
.search:focus, input:focus, select:focus { border-color: var(--accent) !important; outline: none; }
.group { margin-bottom: 10px; }
.group-name { font-size: 13px; color: var(--muted); padding: 6px 8px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; border-radius: 9px; padding: 7px 10px; cursor: pointer; }
.proj:hover { background: var(--surface-2); }
.proj.active { background: var(--accent-soft); }
.proj .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.proj.active .tag { border-color: var(--accent); color: var(--text); }
.proj .when { margin-left: auto; font-size: 12px; color: var(--faint); }
.side-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 14px; }

main { overflow-y: auto; padding: 26px 32px 120px; }
.wrap { max-width: 1040px; margin: 0 auto; }
.hero { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
.hero-text { flex: 1; min-width: 280px; }
.hero h2 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; font-weight: 650; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.pill b { color: var(--text); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 100px 20px; }
.empty h2 { color: var(--text); font-size: 21px; margin-bottom: 6px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.caprow.now input { box-shadow: 0 0 0 2px var(--accent); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { font-size: 12px; font-weight: 600; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
.card-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.card-head h3 { margin: 0; font-size: 16px; font-weight: 650; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 64ch; }
.card-head .grow { flex: 1; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }

.btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; padding: 7px 13px; cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.link { background: none; border: 0; padding: 4px 6px; color: var(--muted); font-weight: 500; }
.btn.link:hover { color: var(--text); }
.btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.hint { font-size: 13px; color: var(--faint); }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

input.text, select.text { background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 6px 9px; width: 100%; }
input.time { width: 96px; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=range] { accent-color: var(--accent); width: 100%; }
input[type=color] { width: 44px; height: 30px; border: 1px solid var(--border); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.sel td { background: var(--accent-soft); }
td.spell { font-weight: 800; letter-spacing: .02em; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.warn { background: rgba(227,160,43,.15); color: var(--warn); }
.badge.ok { background: rgba(63,185,80,.14); color: var(--ok); }
.badge.bad { background: rgba(229,83,75,.15); color: var(--bad, #e5534b); }
.warn { color: var(--warn); font-size: 12.5px; }
.scroll { max-height: 460px; overflow-y: auto; }

/* switch */
.switch { position: relative; display: inline-block; vertical-align: middle; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--border); cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: var(--surface); transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }

.split { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
.player { position: sticky; top: 0; }
video { width: 100%; border-radius: 12px; background: #000; display: block; aspect-ratio: 9/16; }
.video-empty { aspect-ratio: 9/16; border-radius: 12px; border: 1px dashed var(--border); display: grid; place-items: center; text-align: center; color: var(--faint); font-size: 13px; padding: 20px; }
.bars { display: grid; grid-template-columns: 190px 1fr 64px; gap: 7px 12px; align-items: center; font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bars .n { text-align: right; color: var(--muted); }
.drift { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-top: 6px; }
.drift div { flex: 1; background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; min-height: 2px; }
.drift-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 4px; gap: 10px; }
.result { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.result h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent); margin-bottom: 12px; font-size: 14px; }
.banner .grow { flex: 1; }
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; }
.setting label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.setting label span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.setting p { margin: 2px 0 0; font-size: 12.5px; color: var(--faint); }
.toggle-row { display: flex; align-items: center; gap: 12px; }
.toggle-row div { flex: 1; }
.toggle-row b { display: block; font-size: 14px; }
.toggle-row small { color: var(--faint); font-size: 12.5px; }
ol.howto { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
ol.howto li { margin: 3px 0; }
ol.howto b { color: var(--text); font-weight: 600; }
.scripts { display: grid; gap: 8px; }
.script { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.script code { font: 13px/1.3 "Cascadia Code", Consolas, monospace; }
.script span { color: var(--faint); font-size: 13px; flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
details summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; padding: 8px 0; }

.log { position: fixed; left: 290px; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,.2); }
.log-head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; user-select: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.run { background: var(--info); animation: pulse 1.2s infinite; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.log-head .status { font-weight: 600; font-size: 14px; }
.log-head .last { color: var(--muted); font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: "Cascadia Code", Consolas, monospace; }
.log pre { margin: 0; max-height: 34vh; overflow: auto; padding: 0 20px 16px; font: 12.5px/1.55 "Cascadia Code", Consolas, monospace; color: var(--muted); white-space: pre-wrap; }
.log.closed pre { display: none; }
.toast { position: fixed; top: 70px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--bad); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 360px; font-size: 14px; display: none; z-index: 5; }
.toast.good { border-left-color: var(--ok); }

@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } .player { position: static; max-width: 300px; } }
.mobile-only { display: none; }
.player-split { grid-template-columns: 1fr 320px; }
.marker-split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.two.lists { grid-template-columns: 3fr 2fr; }
@media (max-width: 1000px) { .player-split, .two.lists { grid-template-columns: 1fr; } }
body.remote .pc-only, body.remote [data-folder], body.remote [data-open], body.remote [data-script],
body.remote #browseProject, body.remote #browseClip, body.remote #addFolder, body.remote #mkPremiere, body.remote #toPremiere, body.remote #pickVideo { display: none !important; }
canvas#ov, canvas#dt { touch-action: none; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow); }
.qr { background: #fff; border-radius: 12px; padding: 10px; width: 180px; height: 180px; flex: none; }
.qr svg { width: 100%; height: 100%; }
.code { font: 700 30px/1 ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .25em; }
@media (max-width: 900px) {
  .mobile-only { display: inline-block; }
  .kbd-hint { display: none; }
  .icon-btn .lbl { display: none; }
  .icon-btn { width: 38px; padding: 0; }
  .toolbar .btn, .toolbar label { flex: 1 1 auto; }
  .card { padding: 14px; }
  .hero h2 { font-size: 18px; }
  aside { display: none; }
  body.show-projects aside { display: block; }
  header { padding: 0 12px; gap: 8px; padding-top: env(safe-area-inset-top); }
  header .ver { display: none; }
  .app { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; }
  aside { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .log { left: 0; }
  main { padding: 18px 16px 120px; }
  .settings, .two { grid-template-columns: 1fr; }
  .bars { grid-template-columns: 130px 1fr 48px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"><span></span></div>
    <h1>Shorts Toolkit</h1><span class="ver" id="ver"></span>
    <div class="spacer"></div>
    <button class="icon-btn mobile-only" id="projToggle" title="Projects">☰<span class="lbl"> Projects</span></button>
    <button class="icon-btn pc-only" id="phoneBtn" title="Use the toolkit from your phone or tablet">📱<span class="lbl"> Phone</span></button>
    <button class="icon-btn" id="theme" title="Switch light / dark">◐<span class="lbl"> Theme</span></button>
  </header>
  <aside>
    <div class="side-title"><h2>Projects</h2></div>
    <input class="search" id="search" placeholder="Filter projects…" aria-label="Filter projects">
    <div class="side-actions">
      <button class="btn" id="browseProject">Open project…</button>
      <button class="btn" id="browseClip" title="Any recording or video file - no Premiere project needed">Open clip…</button>
      <button class="btn link" id="addFolder" title="Add a folder to scan for projects">+ Folder</button>
    </div>
    <div id="projects"></div>
  </aside>
  <main><div class="wrap" id="main">
    <div class="empty"><h2>Pick a project</h2><p>Choose a Premiere project or open any video clip on the left.<br>Save projects in Premiere first (Ctrl+S) — the toolkit reads the saved file.</p></div>
  </div></main>
</div>
<div class="log closed" id="log">
  <div class="log-head" id="logHead"><span class="dot" id="dot"></span><span class="status" id="status">Ready</span>
    <span class="last" id="last"></span><button class="btn sm" id="pauseJob" style="display:none">❚❚ Pause</button><button class="btn sm danger" id="stopJob" style="display:none">■ Stop</button><span class="hint" id="toggleHint">Show log ▴</span></div>
  <pre id="logText"></pre>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const api = async (url, body) => {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Shorts-Toolkit": "1" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const hms = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
const tc = s => { s = Math.max(0, +s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = (s % 60).toFixed(1).padStart(4, "0"); return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + x; };
const parseTc = t => String(t).trim().split(":").reduce((a, p) => a * 60 + parseFloat(p || 0), 0);
const short = (s, n = 34) => s.length <= n ? s : s.slice(0, 14) + "…" + s.slice(-(n - 15));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function toast(msg, good) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (good ? " good" : ""); t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 5000); }
const media = p => "/media?path=" + encodeURIComponent(p);
const slug = n => n.replace(/[<>:"/\\|?*]+/g, "-").trim() || "short";

// theme
const setTheme = t => { document.documentElement.dataset.theme = t; store.set("theme", t); };
setTheme(store.get("theme", matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

let S = { projects: [], current: null, info: null, busy: false, scripts: [], tab: store.get("tab", "markers"), sel: 0, markers: null, showSugg: false, showLSugg: false };
if (["markers", "shorts", "screams", "look", "captions", "render", "post", "publish", "premiere"].includes(location.hash.slice(1))) S.tab = location.hash.slice(1);

async function loadState() {
  const st = await api("/api/state");
  S.projects = st.projects; S.scripts = st.scripts; S.remote = !!st.remote;
  document.body.classList.toggle("remote", S.remote);
  $("#ver").textContent = "v" + st.version;
  renderProjects();
}
function renderProjects() {
  const q = $("#search").value.toLowerCase(), groups = {};
  for (const p of S.projects) if (!q || p.name.toLowerCase().includes(q)) (groups[p.base] ||= []).push(p);
  $("#projects").innerHTML = Object.entries(groups).map(([base, list]) => `
    <div class="group"><div class="group-name" title="${esc(base)}">${esc(short(base))}</div>
    ${list.sort((a, b) => a.version === "original" ? -1 : b.version === "original" ? 1 : a.version.localeCompare(b.version, undefined, { numeric: true }))
      .map(p => `<button class="proj ${p.path === S.current ? "active" : ""}" data-path="${esc(p.path)}"><span class="tag">${esc(p.version)}</span><span class="when">${ago(p.modified)}</span></button>`).join("")}
    </div>`).join("") || `<p class="hint" style="padding:0 8px">No projects found. Use “Open project…” or “Open clip…”.</p>`;
  $$(".proj").forEach(b => b.onclick = () => { document.body.classList.remove("show-projects"); select(b.dataset.path); });
}
$("#search").oninput = renderProjects;
$("#projToggle").onclick = () => document.body.classList.toggle("show-projects");
$("#phoneBtn").onclick = () => openPhone();

// ---- Phone & tablet (desktop only): switch the companion on, pair devices
async function openPhone() {
  let R;
  try { R = await api("/api/remote"); } catch (e) { return toast(e.message); }
  const back = document.createElement("div"); back.className = "modal-back";
  const draw = () => {
    back.innerHTML = `<div class="modal" role="dialog" aria-label="Phone and tablet">
      <div class="card-head"><div class="grow"><h3>Use it from your phone or tablet</h3>
        <p>Your phone connects to this PC, which does all the work. Only devices you pair can get in, and they can't open files or folders on this PC.</p></div>
        <button class="btn sm icon" id="phClose" title="Close">✕</button></div>
      <div class="toggle-row" style="margin:6px 0 16px"><div><b>Allow my other devices</b><small>Listens on port ${R.port} on your home network and Tailscale. Windows may ask to allow it through the firewall — choose <b>Private networks</b>.</small></div>
        <label class="switch"><input type="checkbox" id="phOn" ${R.enabled ? "checked" : ""}><span></span></label></div>
      ${R.enabled ? `

async function loadTimeline() {

  $$("[data-accept]").forEach(b => b.onclick = () => { const s = sugList()[+b.dataset.accept]; addShort(s.start, s.end, `Best ${String(shortsList().length + 1).padStart(2, "0")} – ${tc(s.start).replace(/\.\d$/, "")}`); });

}

function select2(sel, jump) {
  T.sel = sel; const r = selRange();
  if (r && jump && T.tl) { if (r[0] < T.v0 || r[1] > T.v1) { const pad = (r[1] - r[0]) * 0.3 + 3; setView(r[0] - pad, r[1] + pad); } seek(r[0]); }
  refreshShorts();
}

// ---- caption editor (a selected Short's captions): fix a word, take a caption out.
// Saved per project in toolkit.json "caption_edits"; used by every render and preview.
async function loadCapEdit(s) {
  const box = $("#capEdit"); if (!box) return;
  let r; try { r = await api(`/api/captions?path=${encodeURIComponent(S.current)}&start=${s.start}&end=${s.end}`); }
  catch (e) { box.innerHTML = `<p class="hint">Couldn't read the captions: ${esc(e.message)}</p>`; return; }

  const caps = r.captions;
  if (!caps.length) {
    box.innerHTML = `<h4 style="margin:0 0 4px;font-size:14px">Captions</h4><p class="hint">${r.source === "none"

  }
  const n = caps.filter(c => c.hidden || c.text !== c.orig).length;
  box.innerHTML = `<h4 style="margin:0 0 4px;font-size:14px">Captions <span class="hint" style="font-weight:500">· ${caps.length}${n ? ` · ${n} changed` : ""}</span></h4>
    <p class="hint" style="margin:0 0 8px">Click a time to hear it. Type to fix the words, ✕ takes a caption out. Used when you render${r.source === "premiere" ? " — your Premiere project isn't changed" : ""}.</p>
    <div class="scroll" style="max-height:330px" id="capRows">${caps.map((c, k) => `
      <div class="caprow${c.hidden ? " off" : ""}" data-k="${k}" data-t="${c.start}" data-e="${c.end}" style="display:flex;gap:6px;align-items:center;padding:3px 0">

        <input class="text" data-ctext="${k}" value="${esc(c.hidden ? c.orig : c.text)}" ${c.hidden ? "disabled" : ""} style="flex:1;min-width:0;${c.text !== c.orig && !c.hidden ? "border-color:var(--accent)" : ""}${c.hidden ? ";text-decoration:line-through;opacity:.5" : ""}" title="${c.text !== c.orig ? "Was: " + esc(c.orig) : ""}">
        ${c.hidden || c.text !== c.orig ? `<button class="btn sm" data-crestore="${k}" title="Back to the original">↺</button>` : ""}
        ${c.hidden ? "" : `<button class="btn sm" data-chide="${k}" title="Take this caption out">✕</button>`}
      </div>`).join("")}</div>`;
  const save = async (k, v, msg) => {
    try { S.info.config = await api("/api/config", { path: S.current, patch: { caption_edits: { [caps[k].key]: v } } }); }

    if (msg) toast(msg, true);
    loadCapEdit(s);

  $$("[data-cseek]").forEach(b => b.onclick = () => { seek(Math.max(s.start, caps[+b.dataset.cseek].start - 0.3)); playNow(); });
  $$("[data-ctext]").forEach(inp => {
    inp.onchange = () => { const k = +inp.dataset.ctext, v = inp.value.trim();

    inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); e.stopPropagation(); };   // typing never triggers the timeline keys
  });
  $$("[data-chide]").forEach(b => b.onclick = () => save(+b.dataset.chide, { hide: true }, "Caption taken out — ↺ brings it back"));

}
// the caption under the playhead lights up in the editor
function markCapRow() {

}

// ---- player (plays the source footage at the timeline position)
function segAt(t) {
  let best = null;
  for (const v of T.tl.video) if (v.start <= t && t < v.end && (!best || v.track > best.track)) best = v;
  return best;
}
function setupPlayer() {
  const v = $("#src");
  v.addEventListener("timeupdate", () => {
    if (!T.seg) return;
    const t = T.seg.start + (v.currentTime - T.seg.src);
    if (t >= T.seg.end - 0.02) { const nx = segAt(T.seg.end + 0.01); if (nx) { seek(T.seg.end + 0.01, true); return; } }
    T.play = t; tick();
  });
  v.addEventListener("error", () => {
    const m = $("#srcMsg"); if (!m) return;
    m.innerHTML = `<span style="padding:20px;text-align:center">This recording can't play in the browser (${v.error && v.error.code === 4 ? "its video format isn't supported — e.g. HEVC/H.265" : "it couldn't be read"}).<br>The timeline, suggestions and rendering all still work — use <b>Render</b> or the Look tab's preview to watch.</span>`;
  });
  v.addEventListener("play", () => { T.playing = true; $("#pPlay").textContent = "❚❚ Pause"; });
  v.addEventListener("pause", () => { T.playing = false; $("#pPlay").textContent = "▶ Play"; });
  seek(T.play);
}
function seek(t, keepPlaying) {
  if (!T.tl) return;
  t = Math.max(0, Math.min(T.tl.duration - 0.05, t)); T.play = t;
  const v = $("#src"); if (!v) return;
  const g = segAt(t), msg = $("#srcMsg");
  if (!g) { T.seg = null; v.pause(); if (msg) msg.textContent = "No video here"; tick(); return; }
  if (msg) msg.textContent = "";
  const want = "/media?project=" + encodeURIComponent(S.current) + "&path=" + encodeURIComponent(g.path);
  const was = T.playing || keepPlaying;
  const go = () => { v.currentTime = g.src + (t - g.start); if (was) v.play().catch(() => {}); };
  T.seg = g;
  if (v.dataset.src !== want) { v.dataset.src = want; v.src = want; v.addEventListener("loadedmetadata", go, { once: true }); } else go();
  if (t < T.v0 || t > T.v1) { const w = T.v1 - T.v0; setView(t - w * 0.2, t + w * 0.8); }
  tick();
}
function togglePlay() { const v = $("#src"); if (!v || !T.seg) return; v.paused ? v.play().catch(() => {}) : v.pause(); }
function playNow() { const v = $("#src"); if (v) setTimeout(() => v.play().catch(() => {}), 150); }
function jumpMarker(dir) {
  const ms = T.tl.markers.map(m => m.t).sort((a, b) => a - b);
  const t = dir > 0 ? ms.find(x => x > T.play + 0.05) : [...ms].reverse().find(x => x < T.play - 0.05);
  if (t !== undefined) seek(t);
}
function tick() { const el = $("#pTime"); if (el) el.textContent = tc(T.play); draw(); markCapRow(); }

// ---- canvases
function fitCanvas(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [g, r.width, r.height];
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw() {
  if (!T.tl) return;
  const ov = $("#ov"), dt = $("#dt"); if (!ov || !dt) return;
  const L = T.tl, dur = L.duration, acc = css("--accent"), info = css("--info"), fnt = css("--faint"), txt = css("--text"), mut = css("--muted");
  // overview
  let [g, W, H] = fitCanvas(ov);
  g.fillStyle = css("--bg"); g.fillRect(0, 0, W, H);
  const px = t => t / dur * W;
  g.fillStyle = fnt; g.globalAlpha = 0.5;
  for (let x = 0; x < W; x++) { const i0 = Math.floor(x / W * L.excite.length), i1 = Math.max(i0 + 1, Math.floor((x + 1) / W * L.excite.length)); let m = 0; for (let i = i0; i < i1; i++) m = Math.max(m, L.excite[i]); g.fillRect(x, H - m * H * 0.8, 1, m * H * 0.8); }
  g.globalAlpha = 1;
  g.strokeStyle = mut; g.globalAlpha = 0.5; for (const m of L.markers) { g.beginPath(); g.moveTo(px(m.t) + .5, 0); g.lineTo(px(m.t) + .5, H * 0.35); g.stroke(); } g.globalAlpha = 1;
  g.strokeStyle = info; g.setLineDash([3, 2]); for (const s of sugList()) g.strokeRect(px(s.start), 3, Math.max(2, px(s.end) - px(s.start)), H - 6); g.setLineDash([]);
  g.fillStyle = acc; g.globalAlpha = 0.85; for (const s of shortsList()) g.fillRect(px(s.start), 3, Math.max(2, px(s.end) - px(s.start)), 8); g.globalAlpha = 1;
  g.strokeStyle = txt; g.lineWidth = 1; g.strokeRect(px(T.v0), 0.5, Math.max(3, px(T.v1) - px(T.v0)), H - 1);
  g.fillStyle = "#ff4d4d"; g.fillRect(px(T.play) - 1, 0, 2, H);
  // detail
  [g, W, H] = fitCanvas(dt);
  const span = T.v1 - T.v0, X = t => (t - T.v0) / span * W, lane = 34, base = H - 20;
  g.fillStyle = css("--bg"); g.fillRect(0, 0, W, H);
  g.fillStyle = css("--surface-2"); g.fillRect(0, 0, W, lane);
  const i0 = Math.max(0, Math.floor(T.v0 / L.bin)), i1 = Math.min(L.loud.length, Math.ceil(T.v1 / L.bin));
  const bw = Math.max(1, W / span * L.bin - (span < 400 ? 1 : 0));
  for (let i = i0; i < i1; i++) {
    const x = X(i * L.bin), sp = L.speech[i], ld = L.loud[i], hh = (base - lane - 6);
    g.fillStyle = fnt; g.globalAlpha = 0.18 + 0.25 * sp; g.fillRect(x, base - ld * hh, bw, ld * hh);
    g.globalAlpha = 1; g.fillStyle = acc; g.globalAlpha = 0.55; const e = L.excite[i]; g.fillRect(x, base - 2 - e * 4, bw, 2); g.globalAlpha = 1;
  }
  if (span < 240) { g.fillStyle = fnt; for (const p of L.pauses) if (p > T.v0 && p < T.v1) g.fillRect(X(p), base - 3, 1, 3); }
  g.font = "11px Segoe UI, sans-serif";
  for (const m of L.markers) if (m.t >= T.v0 - 1 && m.t <= T.v1 + 1) {
    g.strokeStyle = mut; g.globalAlpha = 0.7; g.beginPath(); g.moveTo(X(m.t) + .5, lane); g.lineTo(X(m.t) + .5, base); g.stroke(); g.globalAlpha = 1;
    if (m.dur > 0.5) { g.fillStyle = info; g.globalAlpha = 0.15; g.fillRect(X(m.t), lane, X(m.t + m.dur) - X(m.t), base - lane); g.globalAlpha = 1; }
    g.fillStyle = mut; g.fillText(tc(m.t).replace(/\.\d$/, ""), X(m.t) + 3, lane + 12);
  }
  for (const s of L.screams) if (s.on && s.start < T.v1 && s.end > T.v0) { g.fillStyle = "#ff5a3c"; const x = X(s.start); g.beginPath(); g.moveTo(x, base - 44); g.lineTo(x + 6, base - 34); g.lineTo(x - 6, base - 34); g.fill(); }
  for (const s of L.laughs) if (s.on && s.start < T.v1 && s.end > T.v0) { g.fillStyle = "#8ae3ff"; g.beginPath(); g.arc(X(s.start), base - 40, 5, 0, 7); g.fill(); }
  sugList().forEach((s, i) => { if (s.end < T.v0 || s.start > T.v1) return; const sel = T.sel?.kind === "sug" && T.sel.i === i;
    g.strokeStyle = info; g.lineWidth = sel ? 2 : 1; g.setLineDash([5, 3]); g.strokeRect(X(s.start) + .5, 3.5, X(s.end) - X(s.start), lane - 7); g.setLineDash([]); g.lineWidth = 1;
    g.fillStyle = info; g.fillText("suggested · " + s.score, X(s.start) + 6, 21); });
  const rows = shortRows(), rh = (lane - 6) / rows.n;
  shortsList().forEach((s, i) => { if (s.end < T.v0 || s.start > T.v1) return; const sel = T.sel?.kind === "short" && T.sel.i === i, x0 = X(s.start), x1 = X(s.end), y = 3 + rows.row[i] * rh;
    g.fillStyle = acc; g.globalAlpha = sel ? 1 : 0.75; g.fillRect(x0, y, x1 - x0, rh - 1); g.globalAlpha = 0.08; g.fillRect(x0, lane, x1 - x0, base - lane); g.globalAlpha = 1;
    g.fillStyle = css("--accent-ink"); g.save(); g.beginPath(); g.rect(x0, y, x1 - x0, rh - 1); g.clip();
    g.font = `600 ${rh < 18 ? 10 : 12}px Segoe UI, sans-serif`; g.fillText(s.name, x0 + 6, y + rh / 2 + (rh < 18 ? 3.5 : 4.5)); g.restore();
    if (sel) { g.fillStyle = txt; g.fillRect(x0 - 1, y, 3, rh - 1); g.fillRect(x1 - 2, y, 3, rh - 1); } });
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600].find(s => span / s < W / 70) || 600;
  g.fillStyle = fnt; g.font = "10.5px Segoe UI, sans-serif";
  for (let t = Math.ceil(T.v0 / step) * step; t < T.v1; t += step) { g.fillRect(X(t), base, 1, 5); g.fillText(tc(t).replace(/\.0$/, ""), X(t) + 3, H - 5); }
  g.fillStyle = "#ff4d4d"; g.fillRect(X(T.play) - 1, 0, 2, base);
  const zl = $("#zLabel"); if (zl) zl.textContent = `${tc(T.v0).replace(/\.\d$/, "")} – ${tc(T.v1).replace(/\.\d$/, "")}`;
}

// overlapping Shorts are stacked in rows so each stays visible and grabbable
function shortRows() {
  const list = shortsList(), order = list.map((s, i) => i).sort((a, b) => list[a].start - list[b].start), ends = [], row = {};
  for (const i of order) { let r = ends.findIndex(e => e <= list[i].start + 0.01); if (r < 0) { r = ends.length; ends.push(0); } ends[r] = list[i].end; row[i] = r; }
  return { row, n: Math.max(1, ends.length) };
}
function zoom(f, at) {
  const c = at ?? (T.play >= T.v0 && T.play <= T.v1 ? T.play : (T.v0 + T.v1) / 2);
  const a = c - (c - T.v0) * f, b = c + (T.v1 - c) * f; setView(a, b); draw();
}
function snapT(t, e, skip) {
  if (e && e.altKey) return t;
  const span = T.v1 - T.v0, W = $("#dt").getBoundingClientRect().width, tol = x => x / W * span;
  const ms = T.tl.markers.map(m => m.t).concat(T.tl.markers.filter(m => m.dur > 0.5).map(m => m.t + m.dur));
  let best = null, bd = tol(10);
  for (const m of ms) if (Math.abs(m - t) < bd) { bd = Math.abs(m - t); best = m; }
  if (best !== null) return best;
  bd = tol(6);
  for (const p of T.tl.pauses) if (Math.abs(p - t) < bd) { bd = Math.abs(p - t); best = p; }
  return best ?? t;
}
function setupCanvases() {
  const ov = $("#ov"), dt = $("#dt");
  const tAtOv = e => { const r = ov.getBoundingClientRect(); return (e.clientX - r.left) / r.width * T.tl.duration; };
  let ovDrag = false;
  // pointer events = mouse, pen and touch alike
  ov.onpointerdown = e => { ovDrag = true; const t = tAtOv(e), w = T.v1 - T.v0; setView(t - w / 2, t + w / 2); seek(t); };
  const pts = new Map();                            // fingers on the zoomed timeline (for pinch)
  let pinch = null, lastTap = null;
  window.onpointermove = e => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, e.clientX);
    if (pinch && pts.size === 2) {                  // pinch to zoom
      const [a, b] = [...pts.values()], d = Math.max(20, Math.abs(a - b)), f = pinch.d / d;
      const w = Math.max(8, Math.min(T.tl.duration, pinch.w * f)), c = pinch.c;
      setView(c - (c - pinch.v0) / pinch.w * w, c - (c - pinch.v0) / pinch.w * w + w); draw(); return;
    }
    if (ovDrag) { const t = tAtOv(e), w = T.v1 - T.v0; setView(t - w / 2, t + w / 2); draw(); return; }
    if (T.drag) dragMove(e); else if (e.pointerType === "mouse") hover(e);
  };
  window.onpointerup = window.onpointercancel = e => {
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (ovDrag) { ovDrag = false; } if (T.drag) dragEnd();
  };
  const tAt = e => { const r = dt.getBoundingClientRect(); return T.v0 + (e.clientX - r.left) / r.width * (T.v1 - T.v0); };
  const hit = e => {
    const r = dt.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, W = r.width, X = t => (t - T.v0) / (T.v1 - T.v0) * W;
    if (y > 34) return null;
    const list = shortsList(), rows = shortRows(), rh = 28 / rows.n, row = Math.floor((y - 3) / rh);
    for (let i = list.length - 1; i >= 0; i--) { const s = list[i], x0 = X(s.start), x1 = X(s.end);
      if (rows.row[i] !== row) continue;
      const grip = e.pointerType === "touch" ? 16 : 7;
      if (Math.abs(x - x0) < grip) return { kind: "short", i, part: "start" };
      if (Math.abs(x - x1) < grip) return { kind: "short", i, part: "end" };
      if (x > x0 && x < x1) return { kind: "short", i, part: "body" }; }
    const sg = sugList(); for (let i = 0; i < sg.length; i++) { const x0 = X(sg[i].start), x1 = X(sg[i].end); if (x > x0 && x < x1) return { kind: "sug", i, part: "body" }; }
    return null;
  };
  const hover = e => { if (e.target !== dt) return; const h = hit(e); dt.style.cursor = h ? (h.part === "body" ? (h.kind === "short" ? "grab" : "pointer") : "ew-resize") : "crosshair"; };
  dt.onpointerdown = e => {
    pts.set(e.pointerId, e.clientX);
    if (pts.size === 2) {                           // second finger: start a pinch, cancel any drag
      if (T.drag && T.drag.before) { T.undo.push(T.drag.before); }
      T.drag = null;
      const [a, b] = [...pts.values()], r = dt.getBoundingClientRect();
      pinch = { d: Math.max(20, Math.abs(a - b)), w: T.v1 - T.v0, v0: T.v0, c: T.v0 + (((a + b) / 2) - r.left) / r.width * (T.v1 - T.v0) };
      return;
    }
    if (e.pointerType !== "mouse") {                // double-tap = double-click
      const now = Date.now();
      if (lastTap && now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 24) { lastTap = null; dt.ondblclick(e); return; }
      lastTap = { t: now, x: e.clientX };
    }
    const h = hit(e), t = tAt(e);
    if (!h) { seek(t); T.drag = { scrub: true }; return; }
    if (h.kind === "sug") { select2({ kind: "sug", i: h.i }, false); seek(sugList()[h.i].start); return; }
    const s = shortsList()[h.i];
    T.sel = { kind: "short", i: h.i }; T.drag = { i: h.i, part: h.part, t0: t, s0: s.start, e0: s.end, before: structuredClone(shortsList()) }; panel(); draw();
  };
  const dragMove = e => {
    const t = tAt(e);
    if (T.drag.scrub) { seek(t); return; }
    const s = shortsList()[T.drag.i], d = t - T.drag.t0;
    if (T.drag.part === "start") s.start = Math.min(snapT(T.drag.s0 + d, e), s.end - 1);
    else if (T.drag.part === "end") s.end = Math.max(snapT(T.drag.e0 + d, e), s.start + 1);
    else { const len = T.drag.e0 - T.drag.s0, ns = snapT(T.drag.s0 + d, e); s.start = Math.max(0, ns); s.end = s.start + len; }
    s.start = +s.start.toFixed(2); s.end = +s.end.toFixed(2); T.drag.moved = true;
    dt.style.cursor = T.drag.part === "body" ? "grabbing" : "ew-resize"; draw(); panel();
  };
  const dragEnd = () => {
    const d = T.drag; T.drag = null;
    if (d.scrub || !d.moved) return;
    T.undo.push(d.before);
    api("/api/config", { path: S.current, patch: { shorts: shortsList() } }).then(c => { S.info.config = c; refreshShorts(); });
  };
  dt.ondblclick = e => {
    if (hit(e)) return;
    const t = tAt(e), ms = T.tl.markers.map(m => m.t).sort((a, b) => a - b);
    const a = [...ms].reverse().find(x => x <= t), b = ms.find(x => x > t);
    if (a !== undefined && b !== undefined) addShort(a, b, `Clip – ${tc(a).replace(/\.\d$/, "")}`);
    else addShort(t, Math.min(T.tl.duration, t + 30));
  };
  dt.onwheel = e => { e.preventDefault(); if (e.shiftKey) { const w = T.v1 - T.v0; setView(T.v0 + Math.sign(e.deltaY) * w * 0.15, T.v1 + Math.sign(e.deltaY) * w * 0.15); draw(); } else zoom(e.deltaY > 0 ? 1.25 : 0.8, tAt(e)); };
  window.onresize = draw;
  draw();
}

// keyboard (only on the Shorts tab, never while typing)
document.addEventListener("keydown", e => {
  if (S.tab !== "shorts" || !T.tl || !$("#dt")) return;
  if (e.target.closest("input,select,textarea")) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "ArrowRight" || k === "ArrowLeft") { e.preventDefault(); seek(T.play + (k === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 5 : 1)); }
  else if (k === "n" || k === "N") jumpMarker(1);
  else if (k === "p" || k === "P") jumpMarker(-1);
  else if (k === "i" || k === "I") {
    if (T.sel?.kind === "short") { const l = structuredClone(shortsList()); if (T.play < l[T.sel.i].end) { l[T.sel.i].start = +T.play.toFixed(2); saveShorts(l); } }
    else addShort(T.play, Math.min(T.tl.duration, T.play + 30));
  }
  else if (k === "o" || k === "O") { if (T.sel?.kind === "short") { const l = structuredClone(shortsList()); if (T.play > l[T.sel.i].start) { l[T.sel.i].end = +T.play.toFixed(2); saveShorts(l); } } }
  else if ((k === "z" || k === "Z") && (e.ctrlKey || e.metaKey)) {
    e.preventDefault(); const prev = T.undo.pop(); if (!prev) return toast("Nothing to undo");
    api("/api/config", { path: S.current, patch: { shorts: prev } }).then(c => { S.info.config = c; T.sel = null; refreshShorts(); toast("Undone", true); });
  }
  else if (k === "Delete" && T.sel?.kind === "short") { const l = shortsList().filter((_, i) => i !== T.sel.i); T.sel = null; saveShorts(l, "Removed — Ctrl+Z to undo"); }
  else if (k === "Enter" && T.sel) { const r = selRange(); if (r) { seek(r[0]); playNow(); } }
});

function syncRenderButtons() {

function renderProgress(text, j) {
  const box = $("#rProg"); syncRenderButtons();
  if (!box) return;
  if (j.done || !/^Rendering/.test(j.title)) { box.style.display = "none"; return; }
  const items = [...text.matchAll(/^\[(\d+)\/(\d+)\] (.+?)  \(/gm)], last = items.at(-1);
  const fr = text.match(/time=(\d+):(\d+):(\d+)/g), done = fr ? fr.at(-1).match(/(\d+):(\d+):(\d+)/).slice(1).reduce((a, x) => a * 60 + +x, 0) : 0;
  const s = last ? S.info.config.shorts.find(x => x.name === last[3]) : null, len = s ? s.end - s.start : 0;
  const pct = len ? Math.min(100, Math.round(done / len * 100)) : 0;
  box.style.display = "";
  box.innerHTML = last ? `<h4><span>${S.paused ? "Paused on" : "Rendering"} Short ${last[1]} of ${last[2]} — <b style="color:var(--text)">${esc(last[3])}</b></span><span>${pct}%</span></h4>

}

// ---- Laughs (second card on the Screams & laughs tab)
const LAUGH_STYLES = [["heh", "heh heh"], ["huh", "huh huh"], ["hehe", "hehe"], ["ha", "haha"], ["HA", "HAHA"]];
function viewLaughs() {
  const I = S.info, C = I.config.laughs || { on: [], off: [], add: [], style: {} }, L = I.results.laughs;

    : x.source === "under speech" ? `<span class="badge warn" title="Someone is talking at the same time - switching it on hides their caption while the laugh shows">under speech</span>`
    : `<span class="badge warn" title="The model isn't sure this is a laugh">unsure</span>`;
  const row = x => `<tr>
    <td><button class="btn sm icon" data-play="${x.start},${x.end}" title="Listen">▶</button></td>
    <td>${x.at.replace(/\.\d+$/, "")}</td><td class="muted">${x.seconds.toFixed(1)}s</td>
    <td class="muted">${esc(x.kind === "Chuckle, chortle" ? "Chuckle" : x.kind)}</td>

    <td><select class="text" style="width:auto;padding:3px 6px" data-lstyle="${x.start}" data-src="${x.source}">
      ${LAUGH_STYLES.map(([k, l]) => `<option value="${k}" ${x.style === k ? "selected" : ""}>${l}</option>`).join("")}</select></td>
    <td>${x.source === "added" ? `<button class="btn sm icon danger" data-lunadd="${x.start}" title="Remove">✕</button>`

  const head = `<thead><tr><th></th><th>At</th><th>Length</th><th>Kind</th><th>Becomes</th><th>How sure</th><th>Spelling</th><th>On</th></tr></thead>`;
  $("#view").insertAdjacentHTML("beforeend", `
  <div class="card">
    <div class="card-head"><div class="grow"><h3>Laughs</h3>
      <p>Chuckles and laughs spelled out as they happen — “heh heh”, “hahaha”, “HAHAHA” — one syllable per burst of the laugh. Laughs where someone is talking are suggested, so they never cover speech unless you switch them on.</p></div></div>
    ${!L ? `<p class="hint">Press <b>Update screams &amp; laughs</b> above to find laughs.</p>`
      : !L.installed ? `<p class="hint">Laugh detection isn't installed on this PC — see the README (torch + panns_inference + the Cnn14 model).</p>`
      : `<div class="result"><h4><span>${on.length} on</span><span>${ago(L.when)}</span></h4>
        ${on.length ? `<div class="scroll"><table>${head}<tbody>${on.map(row).join("")}</tbody></table></div>` : `<p class="hint">None on.</p>`}</div>
        <details id="lsugg" ${S.showLSugg ? "open" : ""}><summary>Suggestions — off until you switch them on (${sugg.length})</summary>
          <div class="result"><div class="scroll"><table>${head}<tbody>${sugg.map(row).join("")}</tbody></table></div></div></details>`}
    <h4 style="margin:18px 0 8px;font-size:14px">Add a laugh by hand</h4>
    <div class="row">
      <label class="field">Starts<input class="text time" id="laS" placeholder="15:04"></label>
      <label class="field">Ends<input class="text time" id="laE" placeholder="15:06.5"></label>
      <label class="field">Spelling<select class="text" id="laStyle" style="width:auto">${LAUGH_STYLES.map(([k, l]) => `<option value="${k}" ${k === "ha" ? "selected" : ""}>${l}</option>`).join("")}</select></label>

    </div>

  const mark = () => { if (S.info.results.screams) S.info.results.screams.stale = true; };
  $$("[data-ltoggle]").forEach(c => c.onchange = () => {
    const t = +c.dataset.ltoggle, auto = c.dataset.src === "detected";
    const onL = C.on.filter(x => Math.abs(x - t) > 0.3), offL = C.off.filter(x => Math.abs(x - t) > 0.3);
    if (c.checked && !auto) onL.push(t); if (!c.checked && auto) offL.push(t);

  };

    const [s, e] = b.dataset.play.split(",").map(Number);

    try { const r = await api("/api/snippet", { path: S.current, start: s, end: e }); const a = $("#snd"); a.src = media(r.path); a.play(); }
    catch (err) { toast(err.message); }
    b.textContent = "▶";
  });
}

  $("#capStyle").onchange = e => store.set("capStyle", e.target.value);
  $("#capPunct").onchange = e => saveCfg({ look: { punct: e.target.value } }, false);
  $("#capNext").onchange = e => { store.set("capNext", e.target.checked); render(); };
  $("#capGo").onclick = async () => {
    try { await api("/api/bridge/start", { path: S.current, engine: store.get("capEngine", "adobe"), style: store.get("capStyle", "premiere") }); }
    catch (e) { return toast(e.message); }
    watch(true); bridgePoll();
  };
  const c = $("#capCancel"); if (c) c.onclick = () => api("/api/bridge/cancel", {}).then(bridgePoll);
  $("#capInstall").onclick = async () => {
    toast("Installing the Premiere panels…", true);
    try { const r = await api("/api/bridge/install", {}); toast(r.lines.join(" · "), r.ok); } catch (e) { toast(e.message); }
    bridgePoll();
  };
  const w = $("#capWatch"); if (w) w.onclick = () => watch(true);
  const u = $("#capUnwatch"); if (u) u.onclick = () => watch(false);
  if (!W.bTimer) bridgePoll();
}
// punctuation on screen - one setting per project (look.punct), shown in Look and in step 2
const PUNCT = [["keep", "Keep punctuation"], ["soft", "No periods or commas (keep ? and !)"], ["all", "No punctuation at all"]];
const punctSelect = (id, v) => `<select class="text" id="${id}">${PUNCT.map(([k, l]) => `<option value="${k}" ${(v || "keep") === k ? "selected" : ""}>${l}</option>`).join("")}</select>`;
function capCount() { const I = S.info; return (I.sequences.find(s => s.name === I.sequence) || {}).captions || 0; }
// panel status + the automatic job's progress; keeps going while a job runs or the tab is open
async function bridgePoll() {
  clearTimeout(W.bTimer); W.bTimer = null;
  let B; try { B = await api("/api/bridge"); } catch (e) { return; }
  const was = W.bridge && W.bridge.job && W.bridge.job.step, changed = JSON.stringify(W.bridge) !== JSON.stringify(B);
  W.bridge = B;
  const step = B.job.step, mine = B.job.project === S.current;
  if (mine && step !== was) {
    if (step === "failed") { toast("Premiere captions: " + (B.job.lines.at(-1) || "failed").replace(/^\S+ /, "")); }
    if (step === "click") { toast("Finish in Premiere: Text panel › Create captions, then Ctrl+S — watching for it.", true); watch(true); }
  }
  if (changed && S.tab === "captions" && S.info && !capCount()) render();
  const ps = $("#pnStatus"); if (ps && changed) { ps.innerHTML = panelStatus(); wirePanelStatus(); }   // step 1: just the badge, not the player
  const busy = ["speech", "words", "srt", "import"].includes(step);
  if (busy || (S.tab === "captions" && S.info && !capCount()) || (S.tab === "markers" && S.info && !S.info.clip))
    W.bTimer = setTimeout(bridgePoll, busy ? 1000 : 3000);
}
// re-read the saved project every 2 s until its sequence has captions
function watch(on) {
  clearInterval(W.timer); W.timer = null;
  W.on = on; W.for = on ? S.current : null;
  if (on) {
    const path = S.current;
    W.timer = setInterval(async () => {
      if (S.current !== path) return watch(false);
      let I; try { I = await api("/api/info?path=" + encodeURIComponent(path)); } catch (e) { return; }
      const n = (I.sequences.find(s => s.name === I.sequence) || {}).captions || 0;
      if (n > 0) { watch(false); S.info = I; captionsArrived(n); }
    }, 2000);
  }
  if (S.tab === "captions") render();
}
function captionsArrived(n) {
  toast(`${n.toLocaleString()} captions found in Premiere`, true);
  if (store.get("capNext", true) && !S.busy) { S.afterJob = "shorts"; run("check"); }
  else render();
}

// ---- Premiere
function viewPremiere() {
  const I = S.info, R = I.results;
  $("#view").innerHTML = `
  <div class="card">
    <div class="card-head"><div class="grow"><h3>Animate inside Premiere</h3><p>If you'd rather finish in Premiere: every caption gets its own entrance — a full pop after a pause, a tiny one in fast talk, bigger for loud lines, a wobble for screams.</p></div>
      <button class="btn ${R.prepare ? "" : "primary"}" data-run="prepare" ${dis()}>Prepare for Premiere</button></div>
    ${R.prepare ? `<div class="result" style="margin-bottom:14px"><h4><span>Marked <b style="color:var(--text)">${R.prepare.loud}</b> loud lines and <b style="color:var(--text)">${R.prepare.scream}</b> screams</span><span>${ago(R.prepare.when)}</span></h4></div>` : ""}
    <div class="two">
      <div><h4 style="margin:0 0 8px;font-size:14px">In Premiere</h4><ol class="howto">
        <li>Open this project and <b>save</b>.</li><li>Select captions → <b>Graphics and Titles → Upgrade Caption to Graphic</b>.</li>
        <li>Mark the Short with <b>I</b> / <b>O</b> (or select clips).</li><li>Press <b>Run in Premiere</b> next to <b>animate-captions.jsx</b> below.</li></ol></div>
      <div><h4 style="margin:0 0 8px;font-size:14px">Render</h4><ol class="howto">
        <li><b>Ctrl+M</b> → H.264, <b>Match Source – High Bitrate</b>.</li><li>Captions: <b>None</b>.</li><li><b>Send to Media Encoder</b> → <b>Start Queue ▶</b>.</li></ol></div>
    </div>
    <div class="scripts" style="margin-top:16px">
      ${[["animate-captions.jsx", "Pop-in / fade per caption (MODE = \"remove\" to undo)"], ["import-captions.jsx", "Bring the scream caption file in as a new track"],
         ["cut-at-markers.jsx", "Razor every track at every marker"], ["match-scale-vertical.jsx", "1080×1920 + match every clip's scale"]]
        .filter(([f]) => S.scripts.includes(f)).map(([f, w]) => `<div class="script"><code>${f}</code><span>${w}</span><button class="btn sm primary" data-runscript="${f}">Run in Premiere</button><button class="btn sm link" data-script="${f}">VS Code</button></div>`).join("")}
    </div>
  </div>
  <div class="card">
    <div class="card-head"><div class="grow"><h3>Burn captions onto a Premiere export</h3><p>Exported from Premiere with the caption track <b>off</b>? This adds the toolkit's styled captions to that file. Audio is copied untouched.</p></div></div>
    <div class="row">
      <label class="field" style="flex:1;min-width:260px">Exported video<input class="text" id="video" value="${esc(store.get("video", ""))}" placeholder="C:\\…\\export.mp4"></label>
      <button class="btn" id="pickVideo" style="align-self:flex-end">Browse…</button>
      <label class="field">Export starts at<input class="text time" id="start" value="${esc(store.get("vstart", "0"))}"></label>
      <button class="btn primary" data-run="burn" style="align-self:flex-end" ${dis()}>Burn captions</button>
    </div>
  </div>`;
  $("#pickVideo").onclick = async () => { const r = await api("/api/browse", { kind: "video" }); if (r.path) { $("#video").value = r.path; store.set("video", r.path); } };
  $("#video").onchange = e => store.set("video", e.target.value);
  $("#start").onchange = e => store.set("vstart", e.target.value);
}

// run one of premiere/*.jsx inside Premiere through the Shorts Toolkit - Captions panel
async function runInPremiere(script, btn) {
  const label = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = "Working in Premiere…"; }
  try {
    const r = await api("/api/bridge/script", { path: S.current, script });
    toast("Premiere: " + r.message, true);
  } catch (e) {
    if (/panel isn't open/.test(e.message))
      toast("Open the panel once in Premiere: Window › Extensions › Shorts Toolkit - Captions (install it from step 2 if it's not there). Then press this again.");
    else toast("Premiere: " + e.message);
  } finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
}

function wireCommon() {
  $$("[data-run]").forEach(b => b.onclick = () => run(b.dataset.run, b.dataset));
  $$("[data-open]").forEach(b => b.onclick = () => api("/api/open", { path: b.dataset.open, how: "file" }).catch(e => toast(e.message)));
  $$("[data-folder]").forEach(b => b.onclick = () => api("/api/open", { path: b.dataset.folder, how: "folder" }));
  $$("[data-select]").forEach(b => b.onclick = () => select(b.dataset.select));
  $$("[data-script]").forEach(b => b.onclick = () => api("/api/open", { path: "", script: b.dataset.script, how: "vscode" }));
  $$("[data-runscript]").forEach(b => b.onclick = () => runInPremiere(b.dataset.runscript, b));
}

// ---------------------------------------------------------------- jobs
const TITLES = { markers: "Finding the best moments", timeline: "Analysing the video", check: "Checking caption timing", fix: "Creating synced copy", screams: "Updating screams & laughs", prepare: "Preparing for Premiere",
  preview: "Rendering preview", make: "Rendering", burn: "Burning captions onto video", post: "Writing posts" };
async function run(action, data = {}) {
  if (S.busy) return;
  const body = { action, title: TITLES[action], path: S.current };
  if (action === "timeline" || action === "markers") { Object.assign(body, { count: data.count, min: data.min, max: data.max, replace: !!data.replace }); }
  S.mkBefore = action === "markers" ? (data.replace ? 0 : (S.info.config.markers || []).length) : null;
  if (action === "preview") { body.at = $("#pvAt").value.trim(); body.seconds = +$("#pvS").value || 10; }
  if (action === "make") {
    body.preset = store.get("preset", "medium");
    if (data.indexes) { body.indexes = data.indexes; body.title = `Rendering ${data.indexes.length} Short${data.indexes.length === 1 ? "" : "s"}`; }
    else if (data.index !== "" && data.index !== undefined) { body.index = +data.index; body.title = "Rendering " + S.info.config.shorts[body.index].name; S.renderSel = body.index; }
    else body.title = `Rendering all ${S.info.config.shorts.length} Shorts`;
  }
  if (action === "post") { Object.assign(body, data); if (data.schedule) body.title = "Writing + scheduling posts"; }
  if (action === "burn") { body.video = $("#video").value.trim(); body.start = $("#start").value.trim() || "0"; if (!body.video) return toast("Pick the video you exported from Premiere first."); }
  try { await api("/api/run", body); } catch (e) { return toast(e.message); }
  S.busy = true; render(); openLog(true); poll(0);
}
async function poll(from) {
  let j; try { j = await api("/api/job?from=" + from); } catch (e) { setTimeout(() => poll(from), 1000); return; }
  const pre = $("#logText");
  if (from === 0) pre.textContent = "";
  if (j.lines.length) {
    const all = pre.textContent.split("\n");
    if (from > 0 && j.lines[0].startsWith("frame=") && (all.at(-1) || "").startsWith("frame=")) all.pop();
    pre.textContent = [...all.filter((l, i) => i || l), ...j.lines].join("\n");
    pre.scrollTop = pre.scrollHeight;
  }
  $("#last").textContent = pre.textContent.trim().split("\n").at(-1) || "";
  const secs = Math.round(Date.now() / 1000 - j.started);
  $("#stopJob").style.display = j.done ? "none" : "";
  $("#pauseJob").style.display = j.done ? "none" : "";
  $("#pauseJob").textContent = j.paused ? "▶ Resume" : "❚❚ Pause";
  S.paused = !j.done && j.paused; S.jobTitle = j.done ? "" : j.title;
  renderProgress(pre.textContent, j);
  if (!j.done) {
    setStatus(j.paused ? "" : "run", j.paused ? `${j.title} — paused` : `${j.title}… ${secs < 60 ? secs + "s" : Math.floor(secs / 60) + "m " + secs % 60 + "s"}`);
    setTimeout(() => poll(j.total - (j.lines.length && j.lines.at(-1).startsWith("frame=") ? 1 : 0)), 600);
    return;
  }
  S.busy = false; S.paused = false;
  if (j.stopped) { setStatus("", `${j.title} — stopped`); toast("Stopped. Anything finished before that is kept.", true); }
  else {
    setStatus(j.code === 0 ? "ok" : "bad", j.code === 0 ? `${j.title} — done` : `${j.title} — failed (see log)`);
    if (j.code === 0) { openLog(false); toast(j.title + " — done", true); } else openLog(true);
  }
  T.loadedFor = null; T.tl = null;
  if (S.afterJob && !j.stopped && j.code === 0) { S.tab = S.afterJob; store.set("tab", S.tab); }   // captions arrived -> checked -> step 3
  S.afterJob = null;
  await loadState(); await select(S.current, true);
  if (S.mkBefore != null && !j.stopped && j.code === 0) {
    const n = (S.info.config.markers || []).length - S.mkBefore;
    toast(n > 0 ? `Placed ${n} new marker${n === 1 ? "" : "s"}` : "No more good moments at that length — try a different length, or remove markers you don't want.", n > 0);
  }
  S.mkBefore = null;
}
function setStatus(kind, text) { $("#dot").className = "dot " + kind; $("#status").textContent = text; }
function openLog(open) { $("#log").classList.toggle("closed", !open); $("#toggleHint").textContent = open ? "Hide log ▾" : "Show log ▴"; }
$("#logHead").onclick = e => { if (e.target.closest("#stopJob,#pauseJob")) return; openLog($("#log").classList.contains("closed")); };
$("#pauseJob").onclick = async () => { $("#pauseJob").disabled = true; try { const r = await api("/api/pause", { pause: !S.paused }); S.paused = r.paused; $("#pauseJob").textContent = r.paused ? "▶ Resume" : "❚❚ Pause"; syncRenderButtons(); } catch (e) { toast(e.message); } $("#pauseJob").disabled = false; };
$("#stopJob").onclick = async () => { $("#stopJob").disabled = true; try { await api("/api/stop", {}); } catch (e) { toast(e.message); } $("#stopJob").disabled = false; };
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});
setInterval(() => api("/api/ping", {}).catch(() => setStatus("bad", "Toolkit closed — start it again")), 15000);

(async () => {
  await loadState();
  const j = await api("/api/job?from=0");
  if (!j.done) { S.busy = true; openLog(true); poll(0); }
  const last = new URLSearchParams(location.search).get("project") || store.get("project", null);
  const p = S.projects.find(x => x.path === last) || S.projects[0];
  if (p) select(p.path);
})();
</script>
